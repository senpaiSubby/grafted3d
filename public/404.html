<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Grafted3D</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fbfbf9" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        --paper: #fbfbf9;
        --ink: #131518;
        --steel: #5a6168;
        --line: #e2e0d9;
        --line-2: #c9c6bd;
        --accent: #176a49;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background:
          linear-gradient(#1315180d 1px, transparent 1px) 0 0 / 60px 60px,
          linear-gradient(90deg, #1315180d 1px, transparent 1px) 0 0 / 60px 60px,
          var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header,
      main,
      footer {
        padding-inline: clamp(20px, 4vw, 32px);
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 64px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-decoration: none;
        color: var(--ink);
      }

      .brand span {
        color: var(--accent);
      }

      main {
        display: grid;
        align-content: center;
        gap: 16px;
        max-width: 720px;
        width: 100%;
        margin-inline: auto;
        padding-block: 64px;
      }

      .code {
        font-family: var(--mono);
        font-size: 11.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--steel);
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 56px);
        line-height: 1.05;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        max-width: 48ch;
        color: var(--steel);
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 12px;
      }

      .btn {
        display: inline-block;
        padding: 14px 20px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        font-size: 14px;
        text-decoration: none;
      }

      .btn--outline {
        background: transparent;
        color: var(--ink);
      }

      .btn:focus-visible,
      .brand:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      footer {
        padding-block: 20px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--steel);
      }
    </style>
  </head>

  <body>
    <header>
      <a class="brand" href="/">Grafted<span>3D</span></a>
    </header>

    <main>
      <p class="code">Error 404</p>
      <h1>That page isn't here.</h1>
      <p>
        The link may be out of date, or the address has a typo in it. Everything on the site lives
        on one page.
      </p>
      <div class="actions">
        <a class="btn" href="/">Back to the site</a>
        <a class="btn btn--outline" href="/#contact">Send a brief</a>
      </div>
    </main>

    <footer>Grafted3D — design · model · print</footer>
  </body>
</html>
